<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/jpeg" href="/icons/favicon.jpeg" />

    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#000000" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Ludo</title>

    <script>
      // beforeinstallprompt kabhi bhi fire ho sakta hai, React mount hone se
      // pehle bhi. Isliye listener yahan turant lagate hain, React ke
      // useEffect ka intezaar nahi karte, warna event miss ho jaata hai.
      window.__bipEvent = null;
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        window.__bipEvent = e;
        window.dispatchEvent(new Event("bip-ready"));
      });
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
